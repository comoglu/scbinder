# scbinder-tr — alias of scbinder for Turkey / KOERI (network code KO) testing
binder.config      = @CONFIGDIR@/regions/tr/binder-tr.d
binder.eventIdFile = @ROOTDIR@/var/run/scbinder-tr/quake_id.d

# The messaging connection username does NOT default to the alias name —
# every alias otherwise tries to connect as plain "scbinder" and collides
# ("Client name not unique") with any other running instance.
connection.username = scbinder-tr

# Aliases get their own config namespace (scbinder-tr, not scbinder) — any
# pick-group fix in ~/.seiscomp/scbinder.cfg does NOT carry over
# automatically. This system's pickers (Multi-Band AIC, AIC+FSVA) publish
# to L1PICK/ALPICK/RGALPICK, not only PICK — see ~/.seiscomp/scbinder.cfg
# and scanloc.cfg for the same list. Same bug found and fixed on
# scbinder-hv: subscribed and connected fine but received zero picks.
connection.subscriptions = PICK, L1PICK, ALPICK, RGALPICK
