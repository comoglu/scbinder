# scbinder-hv — alias of scbinder for Hawaii / HVO (network code HV) testing
binder.config      = @CONFIGDIR@/regions/hv/binder-hv.d
binder.eventIdFile = @ROOTDIR@/var/run/scbinder-hv/quake_id.d

# The messaging connection username does NOT default to the alias name —
# every alias otherwise tries to connect as plain "scbinder" and collides
# ("Client name not unique") with any other running instance.
connection.username = scbinder-hv

# Aliases get their own config namespace (scbinder-hv, not scbinder) — any
# pick-group fix in ~/.seiscomp/scbinder.cfg does NOT carry over
# automatically. This system's pickers (Multi-Band AIC, AIC+FSVA) publish
# to L1PICK/ALPICK/RGALPICK, not only PICK — see ~/.seiscomp/scbinder.cfg
# and scanloc.cfg for the same list. Without this, scbinder-hv connects
# and subscribes fine but never receives a single pick (confirmed: 0
# picks logged across 3 live runs before this was added).
connection.subscriptions = PICK, L1PICK, ALPICK, RGALPICK
