# scbinder-se — alias of scbinder for national-grid tile se
# (south — stable craton, shallow only, -44.0..-31.5 / 140.0..156.0)
binder.config      = @CONFIGDIR@/national/binder-se.d
binder.eventIdFile = @ROOTDIR@/var/run/scbinder-se/quake_id.d

# The messaging connection username does NOT default to the alias name —
# every alias otherwise tries to connect as plain "scbinder" and collides
# ("Client name not unique") with any other running instance.
connection.username = scbinder-se

# Aliases get their own config namespace (scbinder-se, not scbinder) —
# the pick-group fix in ~/.seiscomp/scbinder.cfg does NOT carry over
# automatically. This system's pickers publish to L1PICK/ALPICK/RGALPICK,
# not just PICK — every tile needs this explicitly.
connection.subscriptions = PICK, L1PICK, ALPICK, RGALPICK
